{% macro ico(nombre, size=16) %}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if nombre == 'calendar' %}<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
  {% elif nombre == 'user' %}<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
  {% elif nombre == 'search' %}<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  {% elif nombre == 'logout' %}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
  {% elif nombre == 'x' %}<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
  {% elif nombre == 'check' %}<polyline points="20 6 9 17 4 12"/>
  {% elif nombre == 'alert' %}<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
  {% elif nombre == 'check-circle' %}<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
  {% elif nombre == 'info' %}<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
  {% elif nombre == 'x-circle' %}<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
  {% elif nombre == 'chevron-right' %}<polyline points="9 18 15 12 9 6"/>
  {% elif nombre == 'chevron-down' %}<polyline points="6 9 12 15 18 9"/>
  {% elif nombre == 'arrow-left' %}<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
  {% elif nombre == 'eye' %}<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
  {% elif nombre == 'droplet' %}<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
  {% elif nombre == 'activity' %}<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
  {% elif nombre == 'download' %}<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
  {% elif nombre == 'filter' %}<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
  {% elif nombre == 'user-x' %}<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="18" y1="8" x2="23" y2="13"/><line x1="23" y1="8" x2="18" y2="13"/>
  {% elif nombre == 'flask' %}<path d="M9 3h6v10l3.5 6a2 2 0 0 1-1.8 3H7.3a2 2 0 0 1-1.8-3L9 13V3z"/><line x1="9" y1="3" x2="15" y2="3"/>
  {% endif %}
</svg>
{% endmacro %}
